[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The desktop app does not need the companion CLI; opt in explicitly:
#   cargo build --features cli --bin livetrans
cli = []

[[bin]]
name = "livetrans"
path = "src/bin/livetrans.rs"
required-features = ["cli"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-global-shortcut = "2.4.1"
anyhow = "1.0.105"
sherpa-onnx = { version = "2.0.3", default-features = false, features = ["shared"] }
# Dynamic loading: the prebuilt ONNX Runtime is /MT, which cannot link into a
# /MD Rust binary. Load onnxruntime.dll at runtime instead (see vendor/).
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-27"] }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
chrono = "0.4"
sha2 = "0.10"

[target."cfg(windows)".dependencies]
cpal = "0.18.2"
wasapi = "0.27.0"
# keyring 3 has no default feature set; without a native store it silently uses
# an in-memory mock, so API keys would vanish on restart.
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
# macOS/Linux builds will need their own keyring feature sets
# (apple-native / linux-native-sync-persistent) when those ports land.
